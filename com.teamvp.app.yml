IssueTracker: https://github.com/alunoadsnoite/tea-mvp/issues
AutoName: TEA Autonomia
Summary: Apoio offline à autonomia e regulação de adultos autistas
Description: |
  TEA Autonomia oferece ferramentas offline para adultos no Espectro Autista.

  Inclui cartão de comunicação de crise, contatos de emergência, check-in de
  bateria social e carga sensorial, rotinas visuais, cartões de regulação e
  respiração guiada.

  Os dados são armazenados no aparelho. Oferece temas claro e escuro, fonte
  ajustável e widget Android para abrir o cartão de crise.

  Contato do desenvolvedor: valdenorsa@proton.me

RepoType: git
Repo: https://github.com/alunoadsnoite/tea-mvp
# Receita candidata: requer validação com fdroid lint/build e revisão do scanner.
Builds:
  - versionName: 1.0.10
    versionCode: 10
    commit: 45a207ba3f95443b89053d6227bd16906c3b67ef
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm openjdk-17-jdk-headless
    init:
      - npm ci
      - npx expo prebuild --platform android --no-install
    prebuild:
      - sed -i '/signingConfig /d' app/build.gradle
      - rm -rf ../node_modules/react-native/sdks/hermesc/win64-bin ../node_modules/react-native/sdks/hermesc/osx-bin
    gradle:
      - 'yes'
    gradleprops:
      - org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
    ndk: 25.1.8937393
    # O compilador Hermes é ferramenta de build FOSS, não código do aplicativo.
    # Repositórios locais/dinâmicos destes módulos foram verificados no código.
    scanignore:
      - android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-system-ui/android/build.gradle
      - node_modules/expo-splash-screen/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-core/android/build.gradle
      - node_modules/expo-keep-awake/android/build.gradle
      - node_modules/expo-haptics/android/build.gradle
      - node_modules/expo-font/android/build.gradle
      - node_modules/expo-file-system/android/build.gradle
      - node_modules/expo-constants/android/build.gradle
      - node_modules/expo/android/build.gradle
    # Remove apenas os arquivos apontados pelo scanner (JSC não usado,
    # binários iOS/Windows e arquivos de distribuição); preserva os fontes.
    scandelete:
      - node_modules

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.10
CurrentVersionCode: 10
