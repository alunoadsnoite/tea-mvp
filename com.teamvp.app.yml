Builds:
  - versionName: 1.0.10
    versionCode: 10
    commit: 9186ad298a279b44577e6bc8e88993d204bbff33
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    init:
      - cd ..
      - npm ci
      - npx expo prebuild --platform android --no-install
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sed -i '/signingConfig /d' app/build.gradle
      - rm -rf ../node_modules/react-native/sdks/hermesc/win64-bin ../node_modules/react-native/sdks/hermesc/osx-bin
    scanignore:
      - android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-system-ui/android/build.gradle
      - node_modules/expo-splash-screen/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-core/android/build.gradle
      - node_modules/expo-keep-awake/android/build.gradle
      - node_modules/expo-haptics/android/build.gradle
      - node_modules/expo-font/android/build.gradle
      - node_modules/expo-file-system/android/build.gradle
      - node_modules/expo-constants/android/build.gradle
      - node_modules/expo/android/build.gradle
    scandelete:
      - node_modules
    ndk: 25.1.8937393
    gradleprops:
      - org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

AutoUpdateMode: None
UpdateCheckMode: None
